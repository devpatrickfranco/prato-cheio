<aside class="sidebar" id="menu-lateral" aria-label="Menu">
    <div>
        <div class="sidebar-brand"><span class="brand">Prato Cheio</span><button class="btn btn-secondary btn-pequeno menu-fechar" type="button" data-menu-fechar>Fechar</button></div>
        <nav class="nav">
            <a class="{% if ativo == 'painel' %}active{% endif %}"{% if ativo == 'painel' %} aria-current="page"{% endif %} href="{% url perfil.url_painel %}">Painel de Impacto</a>
            {% if perfil.doador %}
                <a class="{% if ativo == 'meus_lotes' %}active{% endif %}"{% if ativo == 'meus_lotes' %} aria-current="page"{% endif %} href="{% url 'lotes:meus_lotes' %}">Meus Lotes</a>
                <a class="{% if ativo == 'novo_lote' %}active{% endif %}"{% if ativo == 'novo_lote' %} aria-current="page"{% endif %} href="{% url 'lotes:novo_lote' %}">Anunciar Lote</a>
                <a class="{% if ativo == 'estabelecimento' %}active{% endif %}"{% if ativo == 'estabelecimento' %} aria-current="page"{% endif %} href="{% url 'usuarios:meu_estabelecimento' %}">Meu Estabelecimento</a>
            {% else %}
                <a class="{% if ativo == 'explorar' %}active{% endif %}"{% if ativo == 'explorar' %} aria-current="page"{% endif %} href="{% url 'lotes:explorar' %}">Explorar Lotes</a>
                <a class="{% if ativo == 'reservas' %}active{% endif %}"{% if ativo == 'reservas' %} aria-current="page"{% endif %} href="{% url 'lotes:minhas_reservas' %}">Minhas Reservas</a>
            {% endif %}
        </nav>
    </div>
    <div class="profile">
        <div class="profile-row">
            <div class="avatar">{{ user.iniciais }}</div>
            <div>
                <div class="profile-name">{{ user.nome }}</div>
                <div class="profile-type">{{ perfil.nome }}</div>
            </div>
        </div>
        <form class="profile-actions" action="{% url 'jwt_auth:sair' %}" method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">Sair da conta</button>
        </form>
    </div>
</aside>
