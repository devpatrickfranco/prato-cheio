<div class="field{% if campo.errors %} field--erro{% endif %}">
  {{ campo.label_tag }}
  {{ campo }}
  {% if campo.help_text %}<p class="ajuda" id="{{ campo.auto_id }}_helptext">{{ campo.help_text }}</p>{% endif %}
  <p class="field-erro" id="erro-{{ campo.auto_id }}">{% for erro in campo.errors %}{{ erro }}{% if not forloop.last %} {% endif %}{% endfor %}</p>
</div>
